# Nginx Configuration für server.jonashapp.com
# Datei: /etc/nginx/sites-available/server-monitor
# Aktivieren mit: sudo ln -s /etc/nginx/sites-available/server-monitor /etc/nginx/sites-enabled/

server {
    # HTTP - wird zu HTTPS redirected (von certbot)
    listen 80;
    listen [::]:80;
    server_name server.jonashapp.com;

    # Certbot ACME Challenge Verzeichnis
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect zu HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    # HTTPS
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name server.jonashapp.com;

    # SSL Zertifikate (werden von certbot generiert)
    ssl_certificate /etc/letsencrypt/live/server.jonashapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.jonashapp.com/privkey.pem;

    # SSL Security Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/server-monitor-access.log;
    error_log /var/log/nginx/server-monitor-error.log;

    # Root location
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
    }

    # API Endpoints mit Cache Bypass
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Kein Caching für API
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static Files Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:3000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# Optional: Rate Limiting
# Vor den server blocks hinzufügen:
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
#
# Dann im /api/ location:
# limit_req zone=api_limit burst=5 nodelay;

# Optional: Basic Auth (für Sicherheit)
# Passwort-File erstellen: sudo htpasswd -c /etc/nginx/.htpasswd monitor
# Im location / hinzufügen:
# auth_basic "Server Monitor";
# auth_basic_user_file /etc/nginx/.htpasswd;
